<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Porcentaje</title>

<style>
body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f4f4f4;
}

.contenedor{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    width:300px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    font-size:16px;
}

#resultado{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="contenedor">
    <h2>Calculadora de porcentaje</h2>

    <label>Cantidad</label>
    <input type="number" id="cantidad" placeholder="Ej. 1500">

    <label>Porcentaje</label>
    <input type="number" id="porcentaje" placeholder="Ej. 18">

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
</div>

<script>
function calcular(){
    const cantidad = Number(document.getElementById("cantidad").value);
    const porcentaje = Number(document.getElementById("porcentaje").value);

    const resultado = cantidad * porcentaje / 100;

    document.getElementById("resultado").textContent =
        `${porcentaje}% de ${cantidad} = ${resultado}`;
}
</script>

</body>
</html>
