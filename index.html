<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Porcentaje</title>
<script type="module" src="/src/js/app.js"></script>


</head>

<body>

<div class="contenedor">
    <h2>Calculadora de porcentaje</h2>

    <div>
        <label>Cantidad Total</label>
        <input type="number" id="cantidad_total" placeholder="Ej. 32">
    </div>

    <div>
        <label>Cantidad a calcular</label>
        <input type="number" id="cantidad_a_calcular" placeholder="Ej. 22">
    </div>

    <div>
        <label for="porcentaje">Porcentaje</label>
        <div class="porcentaje-input">
            <input type="number" id="porcentaje" placeholder="Ej. 62">
            <span>%</span>
        </div>
    </div>


    <button id="calcular">Calcular</button>

    <div id="resultado"></div>
</div>

</body>
</html>
